# Login vía DecapBridge (PKCE: Google, Microsoft o contraseña).
# Los valores salen del panel del sitio en https://decapbridge.com.
backend:
  name: git-gateway
  repo: jcamachoc01/Pagina-Citadel
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/a18fe286-5092-485b-860e-c8eede9acaae/pkce
  auth_token_endpoint: /sites/a18fe286-5092-485b-860e-c8eede9acaae/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Cambiar a https://cidatel.co cuando el dominio apunte a Netlify.
site_url: https://clever-cuchufli-c00cce.netlify.app

# Netlify sirve estos archivos estáticos directamente (sin build), por eso publish_mode
# no aplica un generador de sitio: el JSON editado se lee en vivo desde js/main.js.
publish_mode: simple
media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "sitio"
    label: "Contenido del sitio"
    files:
      - name: "principal"
        label: "Contenido principal"
        file: "content/site.json"
        fields:
          - label: "Empresa"
            name: "company"
            widget: "object"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Eslogan", name: "tagline", widget: "string" }
              - { label: "NIT", name: "nit", widget: "string" }

          - label: "Portada (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - { label: "Texto botón WhatsApp", name: "cta_primary", widget: "string" }
              - { label: "Texto botón servicios", name: "cta_secondary", widget: "string" }

          - label: "Sobre nosotros"
            name: "about"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Texto", name: "text", widget: "text" }

          - { label: "Misión", name: "mission", widget: "text" }
          - { label: "Visión", name: "vision", widget: "text" }

          - label: "Servicios"
            name: "services"
            widget: "list"
            label_singular: "Servicio"
            summary: "{{title}}"
            fields:
              - label: "Ícono"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Rayo (eléctrico)", value: "bolt" }
                  - { label: "Red (telecomunicaciones)", value: "network" }
                  - { label: "Escudo (control de acceso)", value: "shield" }
                  - { label: "Llama (incendios)", value: "flame" }
                  - { label: "Cámara (video vigilancia)", value: "camera" }
                  - { label: "Servidor (datacenter)", value: "server" }
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Texto alternativo de la imagen", name: "image_alt", widget: "string", required: false }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }

          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Dirección", name: "address", widget: "string" }
              - { label: "Correo", name: "email", widget: "string" }
              - { label: "Teléfono (texto a mostrar)", name: "phone_display", widget: "string" }
              - label: "WhatsApp (solo números, con código de país, ej. 573153539092)"
                name: "whatsapp_number"
                widget: "string"
                pattern: ['^\d+$', "Solo números, sin espacios ni símbolos"]
              - { label: "Nombre de contacto", name: "contact_name", widget: "string" }
              - { label: "Cargo", name: "contact_role", widget: "string" }
